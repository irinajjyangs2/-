<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스트리머 노래책</title>
<!-- 구글 시트 데이터를 쉽게 읽어오기 위한 도구 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    /* 여기서 디자인 색상을 변경할 수 있습니다 */
    --primary: #ff85a2; /* 포인트(글씨/버튼) 색상 */
    --bg: #fff5f7;      /* 전체 배경 색상 */
    --text: #333;
    --border: #ffd1dc;
  }
  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    max-width: 600px;
    width: 100%;
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
  }
  
  header { text-align: center; margin-bottom: 25px; }
  .icons { color: var(--primary); font-size: 1.2em; margin-bottom: 10px; }
  header h1 { color: var(--primary); margin: 5px 0; font-size: 1.8em; }
  header p { color: #666; font-size: 0.95em; line-height: 1.5; white-space: pre-wrap; }
  
  .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
  input[type="text"].search { 
    width: 100%; padding: 12px 15px; border: 1px solid var(--border); 
    border-radius: 10px; box-sizing: border-box; font-size: 1em; 
  }
  .genres { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    background: #f4f4f4; color: #555; border: none;
    padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;
  }
  .badge.active { background: var(--primary); color: white; }
  
  .song-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
  .song-header h3 { margin: 0; }
  .song-list { list-style: none; padding: 0; margin: 0; }
  .song-item {
    padding: 15px; border-bottom: 1px solid #f0f0f0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .song-title { font-weight: 600; font-size: 1.1em; margin-bottom: 4px; }
  .song-artist { color: #888; font-size: 0.9em; }
  .right-side { display: flex; align-items: center; gap: 6px; }
  .song-genre {
    font-size: 0.8em; background: var(--bg); color: var(--primary);
    padding: 4px 10px; border-radius: 12px; margin-right: 5px; border: 1px solid rgba(0,0,0,0.05);
  }
  
  .btn-small {
    background: white; border: 1px solid var(--primary); color: var(--primary);
    padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: 600;
  }
  .btn-small:hover { background: var(--bg); }

  #loadingBox { text-align: center; padding: 30px; color: #888; font-weight: bold; }

  /* 모달창 */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
  }
  .modal-content {
    background: white; padding: 25px; border-radius: 15px; max-width: 400px; width: 85%;
    max-height: 80vh; display: flex; flex-direction: column; gap: 15px;
  }
  .modal-title { font-size: 1.2em; font-weight: bold; color: var(--primary); margin: 0; }
  .modal-memo {
    background: #f8f9fa; padding: 12px; border-radius: 8px; font-size: 0.9em;
    color: #444; border-left: 4px solid var(--primary); word-break: break-all; display: none;
  }
  .modal-lyrics { flex: 1; overflow-y: auto; white-space: pre-wrap; font-size: 0.95em; line-height: 1.6; color: #444; }
  .close-btn {
    background: var(--primary); color: white; border: none; padding: 10px; 
    border-radius: 8px; cursor: pointer; font-weight: bold;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <!-- 상단 텍스트는 여기서 수정할 수 있습니다 -->
    <div class="icons">♥ ♪ ♥</div>
    <h1>나만의 노래책</h1>
    <p>곡명이나 가수를 검색하거나,<br>원하는 장르에서 신청곡을 골라보세요.</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" class="search" placeholder="⌕ 곡명 또는 가수 검색...">
    
    <!-- 장르 버튼이 들어갈 자리 (엑셀 데이터를 보고 자동으로 채워집니다) -->
    <div class="genres" id="genreContainer">
      <button class="badge active" data-genre="all">전체</button>
    </div>
  </div>

  <div>
    <div class="song-header">
      <h3>노래 목록</h3>
      <span>총 <b id="songCount">0</b>곡</span>
    </div>
    
    <div id="loadingBox">데이터를 불러오는 중입니다... ⏳</div>
    <ul class="song-list" id="songList"></ul>
  </div>
</div>

<!-- 가사 & 메모 팝업창 -->
<div class="modal-overlay" id="lyricsModal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 class="modal-title" id="lyricsModalTitle">곡 제목</h3>
    <div class="modal-memo" id="lyricsModalMemo"></div>
    <div class="modal-lyrics" id="lyricsModalContent">가사 내용</div>
    <button class="close-btn" onclick="closeModal('force')">닫기</button>
  </div>
</div>

<script>
  // ★★★ [중요] 방금 복사한 구글 엑셀(.csv) 링크를 이 아래에 꼭 붙여넣으세요! ★★★
  const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTt93sfFIXdssqt8VfHI-u3HmmxOaFpDGaN-efVI3xxkvjSV9hTGgkf5ZjNTgaW3ftpbD6jdN1ZP6hm/pub?output=csv";
  
  let songs = [];
  let currentGenre = "all";

  // 구글 시트 데이터 가져오기
  function loadSongsFromGoogle() {
    if(sheetUrl === "여기에_구글웹게시_링크를_붙여넣으세요") {
      document.getElementById('loadingBox').textContent = "오류: 코드 안의 sheetUrl에 구글 링크를 먼저 넣어주세요!";
      return;
    }

    Papa.parse(sheetUrl, {
      download: true,
      header: true,
      complete: function(results) {
        songs = results.data.filter(row => row['곡명'] && row['가수']);
        document.getElementById('loadingBox').style.display = 'none';
        
        // 데이터가 다 불러와지면 장르 버튼들을 자동으로 생성하고 화면을 그립니다
        generateGenreButtons();
        renderSongs();
      },
      error: function() {
        document.getElementById('loadingBox').textContent = "데이터를 불러오는데 실패했습니다. 구글 시트 링크를 다시 확인해주세요.";
      }
    });
  }

  // 엑셀 데이터를 바탕으로 장르(카테고리) 버튼 자동 생성
  function generateGenreButtons() {
    const container = document.getElementById("genreContainer");
    
    // '전체' 버튼은 기본으로 둡니다
    container.innerHTML = '<button class="badge active" data-genre="all">전체</button>';
    
    // 엑셀에서 모든 장르를 가져와 중복을 제거합니다
    const allGenres = songs.map(song => song['장르'] ? song['장르'].trim() : "기타");
    const uniqueGenres = [...new Set(allGenres)];

    // 중복 제거된 장르들로 각각 버튼을 만듭니다
    uniqueGenres.forEach(genre => {
      if(genre) {
        const btn = document.createElement("button");
        btn.className = "badge";
        btn.setAttribute("data-genre", genre);
        btn.textContent = genre;
        container.appendChild(btn);
      }
    });
  }

  // 화면에 노래 목록 그리기
  function renderSongs() {
    const searchText = document.getElementById("searchInput").value.toLowerCase();
    
    // 검색어 및 현재 선택된 장르에 맞게 노래 걸러내기
    const filteredSongs = songs.filter(song => {
      const genre = song['장르'] ? song['장르'].trim() : "기타";
      const matchGenre = currentGenre === "all" || genre === currentGenre;
      const title = (song['곡명'] || "").toLowerCase();
      const artist = (song['가수'] || "").toLowerCase();
      const matchSearch = title.includes(searchText) || artist.includes(searchText);
      return matchGenre && matchSearch;
    });

    const songList = document.getElementById("songList");
    songList.innerHTML = "";
    document.getElementById("songCount").textContent = filteredSongs.length;

    // 걸러진 노래들을 화면에 추가
    filteredSongs.forEach((song, index) => {
      const li = document.createElement("li");
      li.className = "song-item";
      
      const genre = song['장르'] ? song['장르'].trim() : "기타";
      let rightButtons = `<span class="song-genre">${genre}</span>`;
      
      const hasLyrics = song['가사'] && song['가사'].trim() !== "";
      const hasMemo = song['메모'] && song['메모'].trim() !== "";

      if (hasLyrics || hasMemo) {
        // 실제 데이터(전체 배열) 안에서의 진짜 인덱스를 찾아 연결
        const realIndex = songs.indexOf(song);
        rightButtons += `<button class="btn-small" onclick="openLyrics(${realIndex})">가사/메모</button>`;
      }
      
      li.innerHTML = `
        <div>
          <div class="song-title">${song['곡명']}</div>
          <div class="song-artist">${song['가수']}</div>
        </div>
        <div class="right-side">
          ${rightButtons}
        </div>
      `;
      songList.appendChild(li);
    });
  }

  // 가사/메모 팝업 띄우기
  function openLyrics(index) {
    const song = songs[index];
    
    if(song) {
      document.getElementById("lyricsModalTitle").textContent = `${song['곡명']} - ${song['가수']}`;
      
      const memoEl = document.getElementById("lyricsModalMemo");
      if(song['메모'] && song['메모'].trim() !== "") {
        let safeMemo = song['메모'].replace(/</g, "&lt;").replace(/>/g, "&gt;");
        let linkedMemo = safeMemo.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--primary); text-decoration:underline;">$1</a>');
        
        memoEl.innerHTML = `<strong>💡 메모:</strong> ${linkedMemo}`;
        memoEl.style.display = "block";
      } else {
        memoEl.style.display = "none";
      }

      document.getElementById("lyricsModalContent").textContent = song['가사'] || "(가사가 없습니다)";
      document.getElementById("lyricsModal").style.display = "flex";
    }
  }

  function closeModal(event) {
    if(event === 'force' || event.target.id === 'lyricsModal') {
      document.getElementById("lyricsModal").style.display = "none";
    }
  }

  // 장르 카테고리 버튼 클릭 시 색상 변경 및 필터링 동작
  document.getElementById("genreContainer").addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON") {
      document.querySelectorAll(".badge").forEach(btn => btn.classList.remove("active"));
      e.target.classList.add("active");
      currentGenre = e.target.getAttribute("data-genre");
      renderSongs();
    }
  });

  document.getElementById("searchInput").addEventListener("input", renderSongs);

  // 실행
  loadSongsFromGoogle();
</script>
</body>
</html>
