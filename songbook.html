<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스트리머 노래책</title>
<style>
  :root {
    --primary: #ff85a2;
    --bg: #fff5f7;
    --secondary: #ffb6c1;
    --text: #333;
    --border: #ffd1dc;
  }
  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    transition: background-color 0.3s ease;
  }
  .container {
    max-width: 600px;
    width: 100%;
    background: white;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
  }
  
  header { text-align: center; margin-bottom: 25px; }
  .icons { color: var(--primary); font-size: 1.2em; margin-bottom: 10px; transition: color 0.3s; }
  header h1 { color: var(--primary); margin: 5px 0; font-size: 1.8em; transition: color 0.3s; }
  header p { color: #666; font-size: 0.95em; line-height: 1.5; white-space: pre-wrap; }
  
  #adminBox {
    background: #fdf2f4;
    border: 2px dashed var(--primary);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 25px;
    display: none;
  }
  #adminBox h4 { margin: 0 0 15px 0; color: var(--primary); font-size: 1.1em; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
  .admin-section { margin-bottom: 15px; }
  .admin-section h5 { margin: 0 0 8px 0; color: #555; }
  
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-row { display: flex; gap: 8px; align-items: center; }
  .color-row { display: flex; gap: 15px; font-size: 0.9em; color: #555; margin-bottom: 5px; }
  .color-row label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  input[type="color"] { width: 35px; height: 35px; padding: 0; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  
  input[type="text"], select, textarea {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    flex: 1;
    font-family: inherit;
    font-size: 0.9em;
  }
  textarea { resize: vertical; min-height: 60px; }
  button.action-btn {
    background: var(--primary); color: white; border: none;
    padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;
    transition: opacity 0.2s;
  }
  button.action-btn:hover { opacity: 0.8; }

  .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
  input[type="text"].search { width: 100%; box-sizing: border-box; font-size: 1em; }
  .genres { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge {
    background: #f4f4f4; color: #555; border: none;
    padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 500;
  }
  .badge.active { background: var(--primary); color: white; }
  
  .song-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
  .song-header h3 { margin: 0; }
  .song-list { list-style: none; padding: 0; margin: 0; }
  .song-item {
    padding: 15px; border-bottom: 1px solid #f0f0f0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .song-title { font-weight: 600; font-size: 1.1em; margin-bottom: 4px; }
  .song-artist { color: #888; font-size: 0.9em; }
  .right-side { display: flex; align-items: center; gap: 6px; }
  .song-genre {
    font-size: 0.8em; background: var(--bg); color: var(--primary);
    padding: 4px 10px; border-radius: 12px; margin-right: 5px; border: 1px solid rgba(0,0,0,0.05);
  }
  
  .btn-small {
    background: white; border: 1px solid var(--border); color: #555;
    padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: 600;
  }
  .btn-lyrics { border-color: var(--primary); color: var(--primary); }
  .btn-small:hover { background: #f9f9f9; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 1.1em; padding: 4px; }
  .icon-btn:hover { transform: scale(1.1); }

  /* 메모장 & 가사 모달창 디자인 */
  .lyrics-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
  .lyrics-header span { font-size: 0.85em; color: #666; font-weight: bold; }
  
  /* 동적 메모 입력칸 스타일 */
  .memo-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .memo-row input.memo-label { flex: 0.35; }
  .memo-row input.memo-content { flex: 0.65; }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
  }
  .modal-content {
    background: white; padding: 25px; border-radius: 15px; max-width: 400px; width: 85%;
    max-height: 80vh; display: flex; flex-direction: column; gap: 15px;
  }
  .modal-title { font-size: 1.2em; font-weight: bold; color: var(--primary); margin: 0; }
  
  .modal-memo {
    background: #f8f9fa; padding: 12px; border-radius: 8px; font-size: 0.9em;
    color: #444; border-left: 4px solid var(--primary); word-break: break-all;
    display: none;
  }
  .modal-memo-item { margin-bottom: 6px; }
  .modal-memo-item:last-child { margin-bottom: 0; }
  .modal-lyrics { flex: 1; overflow-y: auto; white-space: pre-wrap; font-size: 0.95em; line-height: 1.6; color: #444; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="icons" id="pageIconsDisplay">♥ ♪ ♥</div>
    <h1 id="pageTitleDisplay">나만의 노래책</h1>
    <p id="pageDescDisplay">곡명이나 가수를 검색하거나,<br>원하는 장르에서 신청곡을 골라보세요.</p>
  </header>

  <!-- 관리자 전용 영역 -->
  <div id="adminBox">
    <h4>🛠️ 관리자 설정 (나에게만 보임)</h4>
    
    <div class="admin-section">
      <h5>🎨 페이지 색상 및 글자 설정</h5>
      <div class="form-group">
        <div class="color-row">
          <label>포인트 색: <input type="color" id="settingPrimaryColor"></label>
          <label>배경 색: <input type="color" id="settingBgColor"></label>
        </div>
        <input type="text" id="settingIcons" placeholder="상단 아이콘 (예: ♥ ♪ ♥)">
        <input type="text" id="settingTitle" placeholder="메인 제목 입력">
        <textarea id="settingDesc" placeholder="설명 글 입력 (엔터로 줄바꿈 가능)"></textarea>
        <button class="action-btn" onclick="savePageSettings()">설정 적용하기</button>
      </div>
    </div>

    <div class="admin-section">
      <h5>🎵 새 노래 추가</h5>
      <div class="form-group">
        <div class="form-row">
          <input type="text" id="newTitle" placeholder="곡명">
          <input type="text" id="newArtist" placeholder="가수">
          <select id="newGenre" style="flex: 0.5;">
            <option value="J-POP">J-POP</option>
            <option value="K-POP">K-POP</option>
            <option value="애니">애니</option>
            <option value="발라드">발라드</option>
            <option value="기타">기타</option>
          </select>
        </div>
        
        <!-- 메모 다중 추가 영역 -->
        <div class="lyrics-header" style="margin-top: 5px;">
          <span>📝 메모</span>
          <button type="button" class="btn-small" onclick="addMemoRow('newMemoList')">➕ 메모 칸 추가</button>
        </div>
        <div id="newMemoList" class="memo-list">
          <!-- 기본으로 메모 1칸을 띄워둠 -->
          <div class="form-row memo-row">
            <input type="text" class="memo-label" placeholder="메모 이름 (예: MR)">
            <input type="text" class="memo-content" placeholder="메모 내용 (링크 자동 연결)">
            <button type="button" class="btn-small" onclick="this.parentElement.remove()">❌</button>
          </div>
        </div>
        
        <div class="lyrics-header">
          <span>📝 가사</span>
          <button type="button" id="autoLyricsBtn" class="btn-small btn-lyrics" onclick="fetchLyrics('newTitle', 'newArtist', 'newLyrics', 'autoLyricsBtn')">✨ 자동 검색</button>
        </div>
        <textarea id="newLyrics" placeholder="자동 검색을 누르거나 직접 입력하세요"></textarea>
        
        <button class="action-btn" onclick="addNewSong()">목록에 추가하기</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="searchInput" class="search" placeholder="⌕ 곡명 또는 가수 검색...">
    <div class="genres" id="genreContainer">
      <button class="badge active" data-genre="all">전체</button>
      <button class="badge" data-genre="J-POP">J-POP</button>
      <button class="badge" data-genre="K-POP">K-POP</button>
      <button class="badge" data-genre="애니">애니</button>
      <button class="badge" data-genre="발라드">발라드</button>
      <button class="badge" data-genre="기타">기타</button>
    </div>
  </div>

  <div>
    <div class="song-header">
      <h3>노래 목록</h3>
      <span>총 <b id="songCount">0</b>곡</span>
    </div>
    <ul class="song-list" id="songList"></ul>
  </div>
</div>

<!-- 가사 & 다중 메모 보기 모달창 -->
<div class="modal-overlay" id="lyricsModal" onclick="closeModal('lyricsModal', event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 class="modal-title" id="lyricsModalTitle">곡 제목</h3>
    <div class="modal-memo" id="lyricsModalMemo"></div>
    <div class="modal-lyrics" id="lyricsModalContent">가사 내용</div>
    <button class="action-btn" style="padding: 8px;" onclick="closeModal('lyricsModal')">닫기</button>
  </div>
</div>

<!-- 노래 수정 모달창 -->
<div class="modal-overlay" id="editModal" onclick="closeModal('editModal', event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 class="modal-title">곡 정보 수정</h3>
    <input type="hidden" id="editSongId">
    <div class="form-group">
      <div class="form-row">
        <input type="text" id="editTitle" placeholder="곡명">
        <input type="text" id="editArtist" placeholder="가수">
      </div>
      <select id="editGenre">
        <option value="J-POP">J-POP</option>
        <option value="K-POP">K-POP</option>
        <option value="애니">애니</option>
        <option value="발라드">발라드</option>
        <option value="기타">기타</option>
      </select>
      
      <!-- 수정 모달의 메모 다중 추가 영역 -->
      <div class="lyrics-header" style="margin-top: 5px;">
        <span>📝 메모</span>
        <button type="button" class="btn-small" onclick="addMemoRow('editMemoList')">➕ 메모 칸 추가</button>
      </div>
      <div id="editMemoList" class="memo-list"></div>
      
      <div class="lyrics-header" style="margin-top: 10px;">
        <span>📝 가사 수정</span>
        <button type="button" id="editAutoLyricsBtn" class="btn-small btn-lyrics" onclick="fetchLyrics('editTitle', 'editArtist', 'editLyrics', 'editAutoLyricsBtn')">✨ 자동 검색</button>
      </div>
      <textarea id="editLyrics" placeholder="가사를 입력하세요" style="min-height: 120px;"></textarea>
      
      <button class="action-btn" onclick="saveEditedSong()">수정 완료</button>
      <button class="btn-small" onclick="closeModal('editModal')" style="padding: 10px;">취소</button>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const isAdmin = urlParams.get('admin') === 'true';

  if (isAdmin) {
    document.getElementById('adminBox').style.display = 'block';
  }

  const defaultPageInfo = {
    icons: "♥ ♪ ♥",
    title: "나만의 노래책",
    desc: "곡명이나 가수를 검색하거나,\n원하는 장르에서 신청곡을 골라보세요.",
    primaryColor: "#ff85a2",
    bgColor: "#fff5f7"
  };
  
  let pageInfo = JSON.parse(localStorage.getItem("myPageInfo")) || defaultPageInfo;

  function renderPageInfo() {
    document.getElementById('pageIconsDisplay').textContent = pageInfo.icons;
    document.getElementById('pageTitleDisplay').textContent = pageInfo.title;
    document.getElementById('pageDescDisplay').textContent = pageInfo.desc;
    
    document.documentElement.style.setProperty('--primary', pageInfo.primaryColor);
    document.documentElement.style.setProperty('--bg', pageInfo.bgColor);

    if (isAdmin) {
      document.getElementById('settingIcons').value = pageInfo.icons;
      document.getElementById('settingTitle').value = pageInfo.title;
      document.getElementById('settingDesc').value = pageInfo.desc;
      document.getElementById('settingPrimaryColor').value = pageInfo.primaryColor;
      document.getElementById('settingBgColor').value = pageInfo.bgColor;
    }
  }

  function savePageSettings() {
    pageInfo.icons = document.getElementById('settingIcons').value.trim();
    pageInfo.title = document.getElementById('settingTitle').value.trim();
    pageInfo.desc = document.getElementById('settingDesc').value.trim();
    pageInfo.primaryColor = document.getElementById('settingPrimaryColor').value;
    pageInfo.bgColor = document.getElementById('settingBgColor').value;
    
    localStorage.setItem("myPageInfo", JSON.stringify(pageInfo));
    renderPageInfo();
    alert("디자인과 설정이 성공적으로 변경되었습니다!");
  }

  async function fetchLyrics(titleId, artistId, lyricsId, btnId) {
    const title = document.getElementById(titleId).value.trim();
    const artist = document.getElementById(artistId).value.trim();
    const btn = document.getElementById(btnId);

    if (!title || !artist) {
      alert("가사를 검색하려면 곡명과 가수를 먼저 입력해주세요!");
      return;
    }

    btn.textContent = "⏳ 검색 중...";
    btn.disabled = true;

    try {
      const query = encodeURIComponent(`${title} ${artist}`);
      const response = await fetch(`https://lrclib.net/api/search?q=${query}`);
      const data = await response.json();

      if (data && data.length > 0 && data[0].plainLyrics) {
        document.getElementById(lyricsId).value = data[0].plainLyrics;
        alert("✨ 가사를 성공적으로 불러왔습니다!");
      } else {
        alert("🥲 해당 곡의 가사를 찾지 못했습니다.\n(직접 복사해서 붙여넣어주세요)");
      }
    } catch (error) {
      alert("오류가 발생했습니다. 인터넷 연결을 확인해주세요.");
    } finally {
      btn.textContent = "✨ 자동 검색";
      btn.disabled = false;
    }
  }

  // ==== 동적 메모 생성 함수 ====
  function addMemoRow(containerId, label = "", content = "") {
    const container = document.getElementById(containerId);
    const row = document.createElement("div");
    row.className = "form-row memo-row";
    row.innerHTML = `
      <input type="text" class="memo-label" placeholder="메모 이름 (예: MR)" value="${label}">
      <input type="text" class="memo-content" placeholder="메모 내용 (링크 자동 연결)" value="${content}">
      <button type="button" class="btn-small" onclick="this.parentElement.remove()">❌</button>
    `;
    container.appendChild(row);
  }

  function getMemosFromContainer(containerId) {
    const rows = document.querySelectorAll(`#${containerId} .memo-row`);
    const memos = [];
    rows.forEach(row => {
      const label = row.querySelector(".memo-label").value.trim();
      const content = row.querySelector(".memo-content").value.trim();
      if (label || content) {
        memos.push({ label: label || "메모", content });
      }
    });
    return memos;
  }
  // =============================

  let songs = JSON.parse(localStorage.getItem("mySongs")) || [];
  let currentGenre = "all";

  function saveSongsToStorage() {
    localStorage.setItem("mySongs", JSON.stringify(songs));
  }

  function renderSongs() {
    const searchText = document.getElementById("searchInput").value.toLowerCase();
    const filteredSongs = songs.filter(song => {
      const matchGenre = currentGenre === "all" || song.genre === currentGenre;
      const matchSearch = song.title.toLowerCase().includes(searchText) || song.artist.toLowerCase().includes(searchText);
      return matchGenre && matchSearch;
    });

    const songList = document.getElementById("songList");
    songList.innerHTML = "";
    document.getElementById("songCount").textContent = filteredSongs.length;

    filteredSongs.forEach(song => {
      const li = document.createElement("li");
      li.className = "song-item";
      
      let rightButtons = `<span class="song-genre">${song.genre}</span>`;
      
      const hasLyrics = song.lyrics && song.lyrics.trim() !== "";
      const hasOldMemo = song.memo && song.memo.trim() !== "";
      const hasNewMemos = song.memos && song.memos.length > 0;

      if (hasLyrics || hasOldMemo || hasNewMemos) {
        rightButtons += `<button class="btn-small btn-lyrics" onclick="openLyrics(${song.id})">가사/메모</button>`;
      }
      
      if (isAdmin) {
        rightButtons += `<button class="icon-btn" onclick="openEditModal(${song.id})" title="수정">✏️</button>`;
        rightButtons += `<button class="icon-btn" onclick="deleteSong(${song.id})" title="삭제">❌</button>`;
      }

      li.innerHTML = `
        <div>
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist}</div>
        </div>
        <div class="right-side">
          ${rightButtons}
        </div>
      `;
      songList.appendChild(li);
    });
  }

  function addNewSong() {
    const title = document.getElementById("newTitle").value.trim();
    const artist = document.getElementById("newArtist").value.trim();
    const genre = document.getElementById("newGenre").value;
    const lyrics = document.getElementById("newLyrics").value.trim();
    const memos = getMemosFromContainer("newMemoList");

    if (!title || !artist) { alert("곡명과 가수를 입력해주세요!"); return; }

    const newSong = { id: Date.now(), title, artist, genre, lyrics, memos };
    songs.unshift(newSong); 
    saveSongsToStorage();
    renderSongs();

    document.getElementById("newTitle").value = "";
    document.getElementById("newArtist").value = "";
    document.getElementById("newLyrics").value = "";
    document.getElementById("newMemoList").innerHTML = ""; // 추가 칸 비우기
    addMemoRow("newMemoList"); // 기본 1칸 다시 생성
  }

  function deleteSong(id) {
    if (confirm("이 곡을 삭제하시겠습니까?")) {
      songs = songs.filter(song => song.id !== id);
      saveSongsToStorage();
      renderSongs();
    }
  }

  function openEditModal(id) {
    const song = songs.find(s => s.id === id);
    if(song) {
      document.getElementById("editSongId").value = song.id;
      document.getElementById("editTitle").value = song.title;
      document.getElementById("editArtist").value = song.artist;
      document.getElementById("editGenre").value = song.genre;
      document.getElementById("editLyrics").value = song.lyrics || "";
      
      const editMemoList = document.getElementById("editMemoList");
      editMemoList.innerHTML = ""; // 기존 입력칸 초기화
      
      // 구버전 데이터(단일 메모) 호환 처리
      let existingMemos = song.memos || [];
      if (song.memo && existingMemos.length === 0) {
        existingMemos = [{ label: "메모", content: song.memo }];
      }

      if (existingMemos.length > 0) {
        existingMemos.forEach(m => addMemoRow("editMemoList", m.label, m.content));
      } else {
        addMemoRow("editMemoList"); // 비어있으면 1칸 띄워주기
      }

      document.getElementById("editModal").style.display = "flex";
    }
  }

  function saveEditedSong() {
    const id = parseInt(document.getElementById("editSongId").value);
    const title = document.getElementById("editTitle").value.trim();
    const artist = document.getElementById("editArtist").value.trim();
    const genre = document.getElementById("editGenre").value;
    const lyrics = document.getElementById("editLyrics").value.trim();
    const memos = getMemosFromContainer("editMemoList");

    if (!title || !artist) { alert("곡명과 가수를 입력해주세요!"); return; }

    const songIndex = songs.findIndex(s => s.id === id);
    if (songIndex !== -1) {
      songs[songIndex] = { id, title, artist, genre, lyrics, memos };
      // 과거 단일 memo 속성은 삭제해서 데이터 최적화
      delete songs[songIndex].memo; 
      saveSongsToStorage();
      renderSongs();
      closeModal('editModal');
    }
  }

  function openLyrics(id) {
    const song = songs.find(s => s.id === id);
    if(song) {
      document.getElementById("lyricsModalTitle").textContent = `${song.title} - ${song.artist}`;
      
      const memoEl = document.getElementById("lyricsModalMemo");
      memoEl.innerHTML = ""; // 비우기

      // 구버전(단일 메모)과 신버전(다중 메모) 배열 합치기
      let displayMemos = song.memos || [];
      if (song.memo && displayMemos.length === 0) {
        displayMemos = [{ label: "메모", content: song.memo }];
      }

      if (displayMemos.length > 0) {
        displayMemos.forEach(m => {
          let safeContent = m.content.replace(/</g, "&lt;").replace(/>/g, "&gt;");
          let linkedContent = safeContent.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--primary); text-decoration:underline;">$1</a>');
          
          const memoDiv = document.createElement("div");
          memoDiv.className = "modal-memo-item";
          memoDiv.innerHTML = `<strong>💡 ${m.label}:</strong> ${linkedContent}`;
          memoEl.appendChild(memoDiv);
        });
        memoEl.style.display = "block";
      } else {
        memoEl.style.display = "none";
      }

      document.getElementById("lyricsModalContent").textContent = song.lyrics || "(가사가 없습니다)";
      document.getElementById("lyricsModal").style.display = "flex";
    }
  }

  function closeModal(modalId, event) {
    if(!event || event.target.id === modalId) {
      document.getElementById(modalId).style.display = "none";
    }
  }

  document.getElementById("genreContainer").addEventListener("click", (e) => {
    if (e.target.tagName === "BUTTON") {
      document.querySelectorAll(".badge").forEach(btn => btn.classList.remove("active"));
      e.target.classList.add("active");
      currentGenre = e.target.getAttribute("data-genre");
      renderSongs();
    }
  });

  document.getElementById("searchInput").addEventListener("input", renderSongs);

  renderPageInfo();
  renderSongs();
</script>
</body>
</html>
